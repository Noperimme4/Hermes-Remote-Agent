[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-agent"
version = "1.0.0"
description = "Cross-platform remote command execution agent (server + client)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Remote Agent Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
server = [
    "aiofiles>=23.0.0",
    "asyncio-throttle>=1.0.0",
]
client = [
    "click>=8.1.0",
    "rich>=13.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "types-aiofiles>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/remote-agent"
Repository = "https://github.com/YOUR_USERNAME/remote-agent"
Issues = "https://github.com/YOUR_USERNAME/remote-agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "client*", "shared*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W", "PTH", "ERA", "PL"]
ignore = ["S101", "PTH118", "PTH123"]
exclude = [".venv", "venv", "__pycache__", "*.pyc", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"
exclude = '''
/(
    \\.git
  | \\.venv
  | venv
  | __pycache__
  | \\.pytest_cache
  | build
  | dist
)/
'''